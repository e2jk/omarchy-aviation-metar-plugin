name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

      - name: Install qmllint
        run: sudo apt-get update && sudo apt-get install -y qt6-declarative-dev-tools
      - name: qmllint
        # Which categories to suppress, and detecting which of those this
        # Qt version's qmllint actually supports (varies — Ubuntu 24.04
        # packages Qt 6.4.2, older than a typical dev machine's), lives in
        # scripts/run-qmllint.sh — one shared place, not copy-pasted here
        # and in the pre-push hook.
        run: scripts/run-qmllint.sh

      - name: Validate manifest.json
        run: scripts/validate-manifest.sh

      # Pre-installed on GitHub's ubuntu-latest runners, no setup needed.
      - name: shellcheck
        run: shellcheck scripts/git-hooks/pre-push scripts/validate-manifest.sh scripts/run-qmllint.sh
