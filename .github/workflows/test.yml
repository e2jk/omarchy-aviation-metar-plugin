name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

      - name: Install qmllint
        run: sudo apt-get update && sudo apt-get install -y qt6-declarative-dev-tools
      - name: qmllint
        # Quickshell's qs.* namespace and Process's signal typing aren't
        # resolvable without its full build (not available here, or in the
        # pre-push hook's equivalent invocation), so those specific
        # categories are suppressed — see the README's Development section.
        run: |
          /usr/lib/qt6/bin/qmllint \
            --import disable --unresolved-type disable --missing-property disable \
            --inheritance-cycle disable --unqualified disable --signal-handler-parameters disable \
            BarWidget.qml Panel.qml

      - name: Validate manifest.json
        run: scripts/validate-manifest.sh

      # Pre-installed on GitHub's ubuntu-latest runners, no setup needed.
      - name: shellcheck
        run: shellcheck scripts/git-hooks/pre-push scripts/validate-manifest.sh
